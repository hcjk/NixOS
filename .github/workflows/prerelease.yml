name: Build NexOS prerelease

on:
  push:
    branches:
      # Bootstrap v0.6.0-dev because its tag predates this workflow.
      - codex/milestone-6-nexfs
    tags:
      - "v*-dev"

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

env:
  LIMINE_VERSION: "12.3.2"
  RUST_TOOLCHAIN: nightly-2026-07-23

jobs:
  build-and-publish:
    name: Build and publish x86-64 images
    runs-on: ubuntu-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate release version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml)"
          if [[ -z "$version" || "$version" != *-dev ]]; then
            echo "Workspace version must be a development prerelease, got: $version" >&2
            exit 1
          fi

          expected_tag="v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "$expected_tag" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match workspace version ${expected_tag}" >&2
            exit 1
          fi

          notes="docs/releases/${expected_tag}.md"
          if [[ ! -f "$notes" ]]; then
            echo "Release notes are missing: $notes" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            make ovmf qemu-system-x86 xorriso zip

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" \
            --profile minimal \
            --component rust-src \
            --component llvm-tools-preview \
            --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Fetch and build Limine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/limine
          curl --proto '=https' --tlsv1.2 --fail --location \
            "https://github.com/Limine-Bootloader/Limine/releases/download/v${LIMINE_VERSION}/limine-binary.zip" \
            --output /tmp/limine-binary.zip
          unzip -q /tmp/limine-binary.zip -d vendor/limine
          make -C vendor/limine/limine-binary

      - name: Test host components
        shell: bash
        run: |
          cargo test --workspace --exclude nexos-kernel
          cargo clippy --all-targets -- -D warnings

      - name: Build freestanding kernel
        shell: bash
        run: |
          cargo rustc \
            -p nexos-kernel \
            --target kernel/x86_64-nexos.json \
            -Z json-target-spec \
            -Z build-std=core,alloc,compiler_builtins \
            -Z build-std-features=compiler-builtins-mem \
            -- \
            -C link-arg=-Tkernel/linker.ld

      - name: Build raw BIOS and UEFI disk image
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p build
          kernel="target/x86_64-nexos/debug/nexos-kernel"
          limine="vendor/limine/limine-binary"
          image="build/NexOS-v${VERSION}-x86_64.img"

          cargo run -p nexos-installer --bin nex-install -- \
            --target "$image" \
            --kernel "$kernel" \
            --limine "$limine" \
            --size-mib 128 \
            --mode combined \
            --yes \
            --confirm "$image"
          zip -9 -j "build/NexOS-v${VERSION}-x86_64.zip" "$image"

      - name: Build hybrid BIOS and UEFI ISO
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          kernel="target/x86_64-nexos/debug/nexos-kernel"
          limine="vendor/limine/limine-binary"
          staging="build/iso-root"
          iso="build/NexOS-v${VERSION}-x86_64.iso"

          mkdir -p "$staging/boot/limine" "$staging/EFI/BOOT"
          cp "$kernel" "$staging/boot/nexos-kernel"
          cp "$limine/limine-bios.sys" "$staging/boot/limine/"
          cp "$limine/limine-bios-cd.bin" "$staging/boot/limine/"
          cp "$limine/limine-uefi-cd.bin" "$staging/boot/limine/"
          cp "$limine/BOOTX64.EFI" "$staging/EFI/BOOT/"
          python3 - "$limine/limine-bios-hdd.h" \
            "$staging/boot/limine/limine-bios-hdd.bin" <<'PY'
          import pathlib
          import re
          import sys

          source = pathlib.Path(sys.argv[1]).read_text(encoding="ascii")
          payload = bytes(int(value, 16) for value in re.findall(r"0x([0-9a-fA-F]{2})", source))
          if len(payload) < 513:
              raise SystemExit("Limine HDD stage header did not contain a valid boot image")
          pathlib.Path(sys.argv[2]).write_bytes(payload)
          PY

          printf '%s\n' \
            'timeout: 0' \
            '' \
            '/NexOS' \
            '    protocol: limine' \
            '    path: boot():/boot/nexos-kernel' \
            '    module_path: boot():/EFI/BOOT/BOOTX64.EFI' \
            '    module_string: nexos-bootx64' \
            '    module_path: boot():/boot/limine/limine-bios-hdd.bin' \
            '    module_string: nexos-limine-hdd' \
            '    module_path: boot():/boot/limine/limine-bios.sys' \
            '    module_string: nexos-limine-bios' \
            > "$staging/limine.conf"

          xorriso -as mkisofs \
            -R -r -J \
            -b boot/limine/limine-bios-cd.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -hfsplus -apm-block-size 2048 \
            --efi-boot boot/limine/limine-uefi-cd.bin \
            -efi-boot-part --efi-boot-image --protective-msdos-label \
            "$staging" -o "$iso"
          "$limine/limine" bios-install "$iso"

      - name: Verify in-OS install and no-ISO BIOS/UEFI boots
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          firmware="/usr/share/OVMF/OVMF_CODE.fd"
          if [[ ! -f "$firmware" ]]; then
            firmware="$(find /usr/share -type f -name OVMF_CODE.fd -print -quit)"
          fi
          if [[ -z "$firmware" || ! -f "$firmware" ]]; then
            echo "OVMF_CODE.fd was not found after installing ovmf" >&2
            exit 1
          fi
          python3 scripts/qemu-installer-smoke.py \
            --iso "build/NexOS-v${VERSION}-x86_64.iso" \
            --uefi-firmware "$firmware"

      - name: Generate checksums
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          cd build
          sha256sum \
            "NexOS-v${VERSION}-x86_64.img" \
            "NexOS-v${VERSION}-x86_64.iso" \
            "NexOS-v${VERSION}-x86_64.zip" \
            > "NexOS-v${VERSION}-SHA256SUMS.txt"

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: NexOS ${{ steps.metadata.outputs.tag }}
          body_path: ${{ steps.metadata.outputs.notes }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            build/NexOS-v${{ steps.metadata.outputs.version }}-x86_64.iso
            build/NexOS-v${{ steps.metadata.outputs.version }}-x86_64.zip
            build/NexOS-v${{ steps.metadata.outputs.version }}-SHA256SUMS.txt
